<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up — Syndicate Gateway</title>
<meta name="theme-color" content="#000000"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23000'/%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='48' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='5' y='5' width='38' height='38' rx='11' fill='none' stroke='url(%23b)' stroke-width='2.5' stroke-dasharray='5 4'/%3E%3Crect x='13' y='13' width='22' height='22' rx='6' fill='%231a2535' stroke='%2322d3ee' stroke-width='1.5'/%3E%3Cpath d='M18 24.5 L22 28.5 L30 19' fill='none' stroke='%2322d3ee' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://sgp.cloud.appwrite.io" crossorigin/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--void:#000;--surface:#080a0f;--surface2:#0e1117;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--text:#f0f2f5;--muted:#6b7280;--accent:#22d3ee;--accent2:#8b5cf6;--green:#10b981;--red:#f43f5e;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'Geist',sans-serif;font-weight:300;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-x:hidden;position:relative;}
.aurora{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(34,211,238,.08),transparent 55%),radial-gradient(ellipse 45% 35% at 80% 90%,rgba(139,92,246,.06),transparent 55%);pointer-events:none;}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:20px;padding:clamp(1.75rem,5vw,2.5rem);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);}
.brand{display:flex;align-items:center;gap:.65rem;justify-content:center;margin-bottom:1.75rem;}
.brand svg{width:38px;height:38px;}
.brand .bn{display:flex;flex-direction:column;line-height:.95;}
.brand .b1{font-weight:700;letter-spacing:.04em;font-size:.85rem;}
.brand .b2{font-weight:300;letter-spacing:.18em;font-size:.62rem;color:var(--muted);}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;text-align:center;margin-bottom:.4rem;}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.75rem;}
.field{margin-bottom:1.1rem;}
.field label{display:block;font-family:'Geist Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.field input{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Geist',sans-serif;font-size:.9rem;transition:border-color .2s,box-shadow .2s;}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.12);}
.field input::placeholder{color:#3d4148;}
.btn{width:100%;padding:.85rem;background:var(--text);color:#000;border:none;border-radius:10px;font-family:'Geist',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:transform .2s,background .2s;margin-top:.5rem;}
.btn:hover{background:#fff;transform:translateY(-1px);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.msg{display:none;margin-top:1rem;padding:.7rem .9rem;border-radius:9px;font-size:.8rem;line-height:1.5;}
.msg.error{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);color:#fda4af;}
.msg.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;}
.foot{text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--muted);}
.foot a{color:var(--accent);text-decoration:none;font-weight:500;}
.foot a:hover{text-decoration:underline;}
.back{position:fixed;top:1.25rem;left:1.25rem;z-index:2;color:var(--muted);text-decoration:none;font-family:'Geist Mono',monospace;font-size:.7rem;letter-spacing:.06em;transition:color .2s;}
.back:hover{color:var(--text);}
</style>
</head>
<body>
<div class="aurora"></div>
<a href="index.html" class="back">← Back to site</a>

<div class="card">
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none"><defs><linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="13" stroke="url(#bg)" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/><rect x="12" y="12" width="24" height="24" rx="7" fill="#1a2535" stroke="#22d3ee" stroke-width="1.5"/><path d="M17.5 24.5 L22 29 L31 18.5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span class="bn"><span class="b1">SYNDICATE</span><span class="b2">GATEWAY</span></span>
  </div>

  <h1>Create your account</h1>
  <p class="sub">Start building. Live in 7 days.</p>

  <div class="field">
    <label for="name">Full name</label>
    <input type="text" id="name" placeholder="Jane Doe" autocomplete="name"/>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email"/>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password"/>
  </div>

  <button class="btn" id="submitBtn">Create account</button>
  <div class="msg" id="msg"></div>

  <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.0"></script>
<script>
  const APPWRITE_ENDPOINT = 'https://sgp.cloud.appwrite.io/v1';
  const APPWRITE_PROJECT  = '6a271e0d00298cb271d8';
  const { Client, Account, ID } = Appwrite;
  const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT);
  const account = new Account(client);
  function showMsg(el, text, type) {
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + (type || '');
    el.style.display = text ? 'block' : 'none';
  }
</script>
<script>
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

async function doSignup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  // ক্লায়েন্ট-সাইড ভ্যালিডেশন
  if (!name) return showMsg(msg, 'Please enter your name.', 'error');
  if (!email) return showMsg(msg, 'Please enter your email.', 'error');
  if (password.length < 8) return showMsg(msg, 'Password must be at least 8 characters.', 'error');

  btn.disabled = true;
  btn.textContent = 'Creating account…';
  showMsg(msg, '', '');

  try {
    // ১. অ্যাকাউন্ট তৈরি
    await account.create(ID.unique(), email, password, name);
    // ২. সাথে সাথে লগইন
    await account.createEmailPasswordSession(email, password);
    showMsg(msg, 'Account created! Redirecting…', 'success');
    setTimeout(() => window.location = 'dashboard.html', 800);
  } catch (err) {
    showMsg(msg, err.message || 'Something went wrong. Try again.', 'error');
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
}

btn.addEventListener('click', doSignup);
// Enter চাপলেও সাবমিট
document.querySelectorAll('input').forEach(i =>
  i.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); })
);

// আগে থেকে লগইন থাকলে সরাসরি ড্যাশবোর্ডে
account.get().then(() => window.location = 'dashboard.html').catch(() => {});
</script>
</body>
</html>
